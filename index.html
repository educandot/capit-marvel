<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Pedagógica: Ajuste de Posição Inicial</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0b0b0e; 
            font-family: 'Montserrat', sans-serif;
        }

        /* O fundo colorido agora está menor horizontalmente (40vw) */
        .espaco-atividade {
            position: relative;
            width: 40vw; 
            height: 380px;
            background: linear-gradient(45deg, #d41e31, #491f8f);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 30px;
        }

        /* Conteúdo do texto */
        .conteudo-texto {
            max-width: 50%;
            color: #ffffff;
            opacity: 0;
            transform: translateX(-30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            z-index: 1;
        }

        .conteudo-texto h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            line-height: 1.1;
            margin-bottom: 12px;
            text-transform: uppercase;
            color: #f1c40f;
            text-shadow: 2px 3px 4px rgba(0, 0, 0, 0.6);
        }

        .conteudo-texto p {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.4;
            color: #ffffff;
            text-shadow: 1px 2px 5px rgba(0, 0, 0, 0.7);
        }

        /* Imagem configurada para iniciar na parte esquerda do fundo colorido */
        .imagem-personagem {
            position: absolute;
            height: 125%; 
            top: -25%; /* Mantém apenas a cabeça para fora no topo */
            bottom: 0; /* Alinha a base inferior para não passar para baixo do card */
            left: 30%; /* Posição inicial concentrada na parte esquerda do fundo */
            transform: translateX(-50%);
            transition: left 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            z-index: 2;
            filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.5)); 
        }

        /* --- COMPORTAMENTO HOVER --- */

        /* Ao passar o mouse no container: a imagem vai para a direita */
        .espaco-atividade:hover .imagem-personagem {
            left: 75%; 
        }

        /* Ao passar o mouse no container: o texto aparece na esquerda */
        .espaco-atividade:hover .conteudo-texto {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>

    <div class="espaco-atividade">
        
        <div class="conteudo-texto">
            <h1>Capitã Marvel</h1>
            <p>Carol Danvers usa seus poderes cósmicos obtidos através do Tesseract para proteger o universo. Uma força indestrutível que lidera as linhas de frente intergalácticas.</p>
        </div>

        <img src="marvel.png" alt="Capitã Marvel" class="imagem-personagem">
    
    </div>

</body>
</html>
